name: CI Docker front-web

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: GoodFoodCorp/ci-template/.github/workflows/build-deploy.yml@main
    with:
      app_name: "front-web"
      test_image: "node:20"
      test_command: "npm ci && npm run build && npm test"
      # Same origin as the page: the app.c-mbk.fr ingress serves /api, so the
      # session cookies stay first-party and no CORS preflight is needed.
      # STRIPE_PUBLISHABLE_KEY is a repository variable (public, pk_live_/pk_test_).
      build_args: |
        VITE_API_BASE_URL=https://app.c-mbk.fr
        VITE_STRIPE_PUBLISHABLE_KEY=${{ vars.STRIPE_PUBLISHABLE_KEY }}
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      ORG_PIPELINE_TOKEN: ${{ secrets.ORG_PIPELINE_TOKEN }}
