services:
  web-app:
    build:
      context: .
      args:
        # Same origin as the page: nginx proxies /api/* to the services (no CORS).
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    container_name: web-app
    restart: unless-stopped
    ports:
      - "3000:8080"
    networks:
      - microservices-net

# Reaches auth/order/stock/delivery by container name on the shared network:
#   docker network create microservices-net   (once)
networks:
  microservices-net:
    external: true
