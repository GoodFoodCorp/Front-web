<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Good Food">
  <title>Good Food</title>

  <!-- Outer flower — yellow -->
  <g fill="#ffcc00">
    <circle cx="150" cy="150" r="98" />
    <circle cx="228" cy="150" r="76" />
    <circle cx="198.6" cy="211" r="76" />
    <circle cx="132.6" cy="226" r="76" />
    <circle cx="79.7" cy="183.8" r="76" />
    <circle cx="79.7" cy="116.2" r="76" />
    <circle cx="132.6" cy="74" r="76" />
    <circle cx="198.6" cy="89" r="76" />
  </g>

  <!-- Inner flower — dark green, rotated half a petal from the yellow one -->
  <g fill="#004430">
    <circle cx="150" cy="150" r="88" />
    <circle cx="213.1" cy="180.4" r="68" />
    <circle cx="165.6" cy="218.2" r="68" />
    <circle cx="106.4" cy="204.7" r="68" />
    <circle cx="80" cy="150" r="68" />
    <circle cx="106.4" cy="95.3" r="68" />
    <circle cx="165.6" cy="81.8" r="68" />
    <circle cx="213.1" cy="119.6" r="68" />
  </g>

  <!-- Fork -->
  <g fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M100,110 Q140,98 176,92" />
    <path d="M176,68 L174,92" />
    <path d="M188,66 L184,92" />
    <path d="M200,67 L194,93" />
    <path d="M211,71 L203,95" />
    <path d="M174,92 Q170,102 176,110 Q182,116 195,112" />
  </g>

  <!-- Wordmark -->
  <text x="150" y="172" text-anchor="middle" font-family="Montserrat, 'Segoe UI', Arial, sans-serif"
        font-weight="800" font-size="46" fill="#ffcc00" letter-spacing="1">GOOD</text>
  <text x="150" y="216" text-anchor="middle" font-family="Montserrat, 'Segoe UI', Arial, sans-serif"
        font-weight="800" font-size="46" fill="#ffffff" letter-spacing="1">FOOD</text>

  <!-- Spoon -->
  <g fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="112" cy="238" rx="15" ry="20" transform="rotate(-18 112 238)" />
    <path d="M124,251 Q150,268 178,262" />
  </g>
