# Serves the built SPA and proxies /api and /tracking to the services.
# Mirrors the Vite dev proxy and the future K8s ingress: one origin for the
# browser, no CORS. Service hostnames resolve on the shared docker network.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Dish/menu photos are uploaded inline as base64 JSON (menu-service caps
    # them ~3MB decoded) — nginx's 1MB default would reject those before
    # they ever reach the service.
    client_max_body_size 6m;

    # ── auth-service ──
    location ~ ^/api/(auth|user|admin) {
        proxy_pass http://auth-service:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── order-service ──
    location /api/orders {
        proxy_pass http://order-service:8082;
        proxy_set_header Host $host;
    }

    # ── menu-service (per-restaurant menus) ──
    location /api/menu {
        proxy_pass http://menu-service:8085;
        proxy_set_header Host $host;
    }

    # ── payment-service (history + saved payment methods) ──
    location /api/payments {
        proxy_pass http://payment-service:8086;
        proxy_set_header Host $host;
    }

    # ── franchise-service (restaurants + suppliers) ──
    location ~ ^/api/(restaurants|franchise) {
        proxy_pass http://franchise-service:8089;
        proxy_set_header Host $host;
    }

    # ── user-service (profiles, addresses) ──
    # '^~' so this prefix wins over the auth regex below (/api/user is a
    # prefix of /api/users).
    location ^~ /api/users {
        proxy_pass http://user-service:8087;
        proxy_set_header Host $host;
    }

    # ── reservation-service ──
    location /api/reservations {
        proxy_pass http://reservation-service:8088;
        proxy_set_header Host $host;
    }

    # ── promo-service ──
    location /api/promos {
        proxy_pass http://promo-service:8092;
        proxy_set_header Host $host;
    }

    # ── assistant-service (chat) ──
    location /api/chat {
        proxy_pass http://assistant-service:8093;
        proxy_set_header Host $host;
        # A local model can take a while on its first answer (it loads into
        # memory); assistant-service allows up to AI_TIMEOUT_SECONDS (120).
        proxy_read_timeout 130s;
    }

    # ── stock-service ──
    location ~ ^/api/(stocks|replenishment-requests) {
        proxy_pass http://stock-service:8083;
        proxy_set_header Host $host;
    }

    # ── analytics-service (KPI du réseau) ──
    location /api/analytics {
        proxy_pass http://analytics-service:8091;
        proxy_set_header Host $host;
    }

    # ── delivery-service (REST) ──
    location /api/deliveries {
        proxy_pass http://delivery-service:8084;
        proxy_set_header Host $host;
    }
 
    # ── delivery-service (courier profile, earnings, withdrawals — used by the mobile app) ──
    location /api/courier-profile {
        proxy_pass http://delivery-service:8084;
        proxy_set_header Host $host;
    }

    # ── delivery-service (Socket.IO transport: the client connects to /socket.io, namespace /tracking) ──
    location /socket.io/ {
        proxy_pass http://delivery-service:8084;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # ── delivery-service (WebSocket tracking) ──
    location /tracking {
        proxy_pass http://delivery-service:8084;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # ── SPA fallback ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
