# Serves the built SPA and proxies /api and /tracking to the services.
# Mirrors the Vite dev proxy and the K8s ingress: one origin for the browser,
# no CORS.
#
# Installed as a template (/etc/nginx/templates): the image entrypoint fills
# ${NGINX_LOCAL_RESOLVERS} with the container's DNS server (Docker's or the
# cluster's). Upstreams are variables, so their names are re-resolved every
# 10 s: a redeployed service with a new IP is reached again at once, instead
# of failing with 502 until nginx restarts.
resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Dish/menu photos are uploaded inline as base64 JSON (menu-service caps
    # them ~3MB decoded) — nginx's 1MB default would reject those before
    # they ever reach the service.
    client_max_body_size 6m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # Inherited by every proxied location that sets no header of its own.
    # The client address reaches the services (login rate limit, logs):
    # without it every user would share the gateway's address.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── auth-service ──
    location ~ ^/api/(auth|user|admin) {
        set $auth_service http://auth-service:8081;
        proxy_pass $auth_service;
    }

    # ── order-service (orders, invoices, reviews) ──
    location ~ ^/api/(orders|reviews) {
        set $order_service http://order-service:8082;
        proxy_pass $order_service;
    }

    # ── menu-service (menus, categories, plans) ──
    location /api/menu {
        set $menu_service http://menu-service:8085;
        proxy_pass $menu_service;
    }

    # ── payment-service (history, saved cards, Stripe webhooks) ──
    location /api/payments {
        set $payment_service http://payment-service:8086;
        proxy_pass $payment_service;
    }

    # ── franchise-service (restaurants + suppliers) ──
    location ~ ^/api/(restaurants|franchise) {
        set $franchise_service http://franchise-service:8089;
        proxy_pass $franchise_service;
    }

    # ── user-service (profiles, addresses, favorites, avatars) ──
    # '^~' so this prefix wins over the auth regex above (/api/user is a
    # prefix of /api/users).
    location ^~ /api/users {
        set $user_service http://user-service:8087;
        proxy_pass $user_service;
    }

    # ── reservation-service ──
    location /api/reservations {
        set $reservation_service http://reservation-service:8088;
        proxy_pass $reservation_service;
    }

    # ── promo-service ──
    location /api/promos {
        set $promo_service http://promo-service:8092;
        proxy_pass $promo_service;
    }

    # ── assistant-service (chat) ──
    location /api/chat {
        set $assistant_service http://assistant-service:8093;
        proxy_pass $assistant_service;
        # A local model can take a while on its first answer (it loads into
        # memory); assistant-service allows up to AI_TIMEOUT_SECONDS (120).
        proxy_read_timeout 130s;
    }

    # ── stock-service ──
    location ~ ^/api/(stocks|replenishment-requests) {
        set $stock_service http://stock-service:8083;
        proxy_pass $stock_service;
    }

    # ── analytics-service (network KPIs) ──
    location /api/analytics {
        set $analytics_service http://analytics-service:8091;
        proxy_pass $analytics_service;
    }

    # ── delivery-service (REST, courier profile, earnings, withdrawals) ──
    location ~ ^/api/(deliveries|courier-profile|notifications) {
        set $delivery_service http://delivery-service:8084;
        proxy_pass $delivery_service;
    }

    # ── delivery-service (Socket.IO: transport on /socket.io, namespace /tracking) ──
    location ~ ^/(socket\.io|tracking) {
        set $delivery_service http://delivery-service:8084;
        proxy_pass $delivery_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # With its port: delivery-service compares it to the page's Origin
        # (a page of another site never gets a socket).
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
    }

    # ── Bundle files carry a content hash: cached for a year ──
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # ── SPA fallback: index.html is never cached, so a deploy is seen at once ──
    # The page may only run its own scripts and Stripe's (payment form), talk
    # to this origin and Stripe, and never be framed: an injected script or a
    # clickjacking page has nowhere to go. Images: photos, map tiles, avatars.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.stripe.com https://*.js.stripe.com; frame-src https://js.stripe.com https://*.js.stripe.com https://hooks.stripe.com; connect-src 'self' https://api.stripe.com https://*.stripe.com; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(self \"https://js.stripe.com\")" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri $uri/ /index.html;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
