# Serves the built SPA and proxies /api and /tracking to the services.
# Mirrors the Vite dev proxy and the future K8s ingress: one origin for the
# browser, no CORS. Service hostnames resolve on the shared docker network.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── auth-service ──
    location ~ ^/api/(auth|user|admin) {
        proxy_pass http://auth-service:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── order-service ──
    location /api/orders {
        proxy_pass http://order-service:8082;
        proxy_set_header Host $host;
    }

    # ── menu-service (per-restaurant menus) ──
    location /api/menu {
        proxy_pass http://menu-service:8085;
        proxy_set_header Host $host;
    }

    # ── franchise-service (restaurants + suppliers) ──
    location ~ ^/api/(restaurants|franchise) {
        proxy_pass http://franchise-service:8089;
        proxy_set_header Host $host;
    }

    # ── user-service (profiles, addresses) ──
    # '^~' so this prefix wins over the auth regex below (/api/user is a
    # prefix of /api/users).
    location ^~ /api/users {
        proxy_pass http://user-service:8087;
        proxy_set_header Host $host;
    }

    # ── reservation-service ──
    location /api/reservations {
        proxy_pass http://reservation-service:8088;
        proxy_set_header Host $host;
    }

    # ── stock-service ──
    location ~ ^/api/(stocks|replenishment-requests) {
        proxy_pass http://stock-service:8083;
        proxy_set_header Host $host;
    }

    # ── delivery-service (REST) ──
    location /api/deliveries {
        proxy_pass http://delivery-service:8084;
        proxy_set_header Host $host;
    }

    # ── delivery-service (WebSocket tracking) ──
    location /tracking {
        proxy_pass http://delivery-service:8084;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # ── SPA fallback ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
